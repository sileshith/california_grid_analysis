services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: grid
      POSTGRES_DB: grid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grid -d grid"]
      interval: 5s
      timeout: 5s
      retries: 20
  scheduler:
    image: apache/airflow:2.10.5-python3.12
    command: standalone
    depends_on:
      database:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${GRID_COMPOSE_DATABASE_URL:?set a PostgreSQL URL for the database service}
      GRID_DATABASE_URL: ${GRID_COMPOSE_DATABASE_URL}
      GRID_STAGE: /opt/airflow/stage
      EIA_API_KEY: ${EIA_API_KEY:-}
      PYTHONPATH: /opt/grid
    volumes:
      - .:/opt/grid:ro
      - ./dags/grid_interval_operations.py:/opt/airflow/dags/grid_interval_operations.py:ro
      - stage:/opt/airflow/stage
volumes:
  database:
  stage:
