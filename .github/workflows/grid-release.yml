name: Grid release audit
on: [pull_request, push]
jobs:
  fixture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gridtest
          POSTGRES_USER: gridtest
          POSTGRES_PASSWORD: gridtest
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-release.txt
      - run: sudo apt-get update && sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended fonts-texgyre poppler-utils
      - run: ruff check --select E9,F63,F7,F82 src dags tests
      - run: make demo PYTHON=python
      - run: python -m pytest -q tests/test_release_contract.py -k transaction
        env:
          GRID_TEST_DATABASE_URL: postgresql+psycopg2://gridtest:gridtest@localhost:5432/gridtest
      - run: make report PYTHON=python
      - run: python -m src.check_stale_numbers
      - uses: actions/upload-artifact@v4
        with:
          name: employer-report
          path: reports/California_Grid_Analytics_Report_Sileshi_Hirpa.pdf
